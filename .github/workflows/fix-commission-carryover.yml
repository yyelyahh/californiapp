name: Fix commission carryover

on:
  push:
    branches:
      - fix/commission-carryover

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch commission carryover
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          commissions = "src/pages/CommissionsPage.tsx"
          old = '''      const legacyCredit = 0;
          const saldoConsumo = consumoTotal;
          const retiradasCount = retiradas.length + manualDebts.length;

          const periodBalance = accrued - saldoConsumo + debtPaymentsTotal - commPaid;
          const priorBalance = 0;
          const balance = periodBalance;'''
          new = '''      const legacyCredit = 0;
          const saldoConsumo = consumoTotal;
          const retiradasCount = retiradas.length + manualDebts.length;

          // Saldo anterior = tudo que ficou pendente antes do primeiro mês exibido.
          // Ele é carregado para o período atual e então recebe as movimentações do mês.
          const priorBalance = closedStart > PROJECT_START ? (() => {
            const priorEnd = new Date(closedStart.getTime() - 1);
            const priorClosed = computeClosedCommission(vendasPagasTodas, PROJECT_START, priorEnd);
            const priorConsumption = sellerManualDebts
              .filter(d => d.sellerId === seller.id && d.date >= PROJECT_START.toISOString() && d.date < closedStart.toISOString() && !isLegacy(d.date))
              .reduce((a, d) => a + d.amount, 0)
              + sales
                .filter(s => s.sellerId === seller.id && s.type === "retirada_funcionario" && s.date >= PROJECT_START.toISOString() && s.date < closedStart.toISOString() && !isLegacy(s.date))
                .reduce((a, s) => a + s.totalPrice, 0);
            const priorDebtPayments = sellerDebtPayments
              .filter(p => p.sellerId === seller.id && p.date >= PROJECT_START.toISOString() && p.date < closedStart.toISOString() && !isLegacy(p.date))
              .reduce((a, p) => a + p.amount, 0);
            const priorCommissionPaid = commissionPayments
              .filter(p => p.sellerId === seller.id && p.date >= PROJECT_START.toISOString() && p.date < closedStart.toISOString() && !isLegacy(p.date))
              .reduce((a, p) => a + p.amount, 0);
            return priorClosed.accrued - priorConsumption + priorDebtPayments - priorCommissionPaid;
          })() : 0;

          const periodBalance = accrued - saldoConsumo + debtPaymentsTotal - commPaid;
          const balance = priorBalance + periodBalance;'''
          replace_once(commissions, old, new)

          old = '''      `Comissão: ${formatCurrency(r.accrued)}`,
          `Consumo: -${formatCurrency(r.retiradasTotal)}`,'''
          new = '''      `Saldo anterior: ${formatCurrency(r.priorBalance)}`,
          `Comissão: ${formatCurrency(r.accrued)}`,
          `Consumo: -${formatCurrency(r.retiradasTotal)}`,'''
          replace_once(commissions, old, new)

          old = '''                    <Line label="Faixa" value={consultRow.tier.label} tone="muted" />
                    <Line label="Comissão" value={formatCurrency(consultRow.accrued)} tone="income" />'''
          new = '''                    <Line label="Faixa" value={consultRow.tier.label} tone="muted" />
                    <Line label="Saldo anterior" value={formatCurrency(consultRow.priorBalance)} tone={consultRow.priorBalance > 0.01 ? "warning" : "muted"} />
                    <Line label="Comissão" value={formatCurrency(consultRow.accrued)} tone="income" />'''
          replace_once(commissions, old, new)

          old = '''                <div className="flex justify-between"><span className="text-muted-foreground">Faturamento</span><span className="mono">{formatCurrency(sellerRow.vendasTotal)}</span></div>
                <div className="flex justify-between"><span className="text-muted-foreground">Comissão acumulada ({sellerRow.tier.label})</span><span className="mono text-income">{formatCurrency(sellerRow.accrued)}</span></div>'''
          new = '''                <div className="flex justify-between"><span className="text-muted-foreground">Faturamento</span><span className="mono">{formatCurrency(sellerRow.vendasTotal)}</span></div>
                <div className="flex justify-between"><span className="text-muted-foreground">Saldo anterior</span><span className="mono">{formatCurrency(sellerRow.priorBalance)}</span></div>
                <div className="flex justify-between"><span className="text-muted-foreground">Comissão acumulada ({sellerRow.tier.label})</span><span className="mono text-income">{formatCurrency(sellerRow.accrued)}</span></div>'''
          replace_once(commissions, old, new)

          report = "src/components/SellerReportDrawer.tsx"
          old = '''    const previousBalance = 0;

          // Saldo do período + saldo trazido
          const periodBalance = c.accrued - saldoConsumo + debtPaymentsTotal - commPaidPeriod;
          const commBalance = periodBalance;'''
          new = '''    // Saldo anterior: tudo que ficou pendente antes do primeiro mês exibido.
          const previousBalance = closedStart > LEGACY_CUTOFF ? (() => {
            const priorEnd = new Date(closedStart.getTime() - 1);
            const priorClosed = computeClosedCommission(vendasPagasTodas, LEGACY_CUTOFF, priorEnd);
            const priorConsumption = sellerManualDebts
              .filter(d => d.sellerId === seller.id && d.date >= LEGACY_CUTOFF.toISOString() && d.date < closedStart.toISOString() && !isLegacy(d.date))
              .reduce((a, d) => a + d.amount, 0)
              + sales
                .filter(s => s.sellerId === seller.id && s.type === "retirada_funcionario" && s.date >= LEGACY_CUTOFF.toISOString() && s.date < closedStart.toISOString() && !isLegacy(s.date))
                .reduce((a, s) => a + s.totalPrice, 0);
            const priorDebtPayments = sellerDebtPayments
              .filter(p => p.sellerId === seller.id && p.date >= LEGACY_CUTOFF.toISOString() && p.date < closedStart.toISOString() && !isLegacy(p.date))
              .reduce((a, p) => a + p.amount, 0);
            const priorCommissionPaid = commissionPayments
              .filter(p => p.sellerId === seller.id && p.date >= LEGACY_CUTOFF.toISOString() && p.date < closedStart.toISOString() && !isLegacy(p.date))
              .reduce((a, p) => a + p.amount, 0);
            return priorClosed.accrued - priorConsumption + priorDebtPayments - priorCommissionPaid;
          })() : 0;

          // Saldo do período + saldo trazido
          const periodBalance = c.accrued - saldoConsumo + debtPaymentsTotal - commPaidPeriod;
          const commBalance = previousBalance + periodBalance;'''
          replace_once(report, old, new)

          old = '''    lines.push(`• Comissão gerada: ${fmt(report.accrued)}`);
          lines.push(`• (−) Consumo no mês: ${fmt(report.saldoConsumo)}`);'''
          new = '''    lines.push(`• Saldo anterior: ${fmt(report.previousBalance)}`);
          lines.push(`• Comissão gerada: ${fmt(report.accrued)}`);
          lines.push(`• (−) Consumo no mês: ${fmt(report.saldoConsumo)}`);'''
          replace_once(report, old, new)

          old = '''            <SummaryRow label="Comissão gerada" value={fmt(report.accrued)} tone="income" sign="+" />
            <SummaryRow label="Consumo" value={fmt(report.saldoConsumo)}'''
          new = '''            <SummaryRow label="Saldo anterior" value={fmt(report.previousBalance)} tone={report.previousBalance > 0.01 ? "warning" : "muted"} sign="+" />
            <SummaryRow label="Comissão gerada" value={fmt(report.accrued)} tone="income" sign="+" />
            <SummaryRow label="Consumo" value={fmt(report.saldoConsumo)}'''
          replace_once(report, old, new)

          p = Path(".github/workflows/fix-commission-carryover.yml")
          p.unlink()
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CommissionsPage.tsx src/components/SellerReportDrawer.tsx .github/workflows/fix-commission-carryover.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: carry seller commission balance across months"
          git push
